name: Publish SQL Assistant data (reads need no token)
# Mirrors sql-assistant-data/** of this PRIVATE repository into dist/sql-assistant-data/ — the folder the site is served from — so that SQL Assistant on any device can READ the schema registry, the encrypted
# Secret Vault, the knowledge file and the admin message from the site, with NO GitHub credential: no PAT, no sign-in, no approval, no SSO, nothing copied between devices.
# This workflow uses only the built-in GITHUB_TOKEN (permissions below). It never needs the central PAT.
# V17.6.5: the central Admin Password record  sql-assistant-data/security/admin-credential.json  is published like every other file of the folder (that is how a device with NO token verifies the Admin Password). A push that changes it
#         starts this workflow (the trigger `sql-assistant-data/**` covers `sql-assistant-data/security/**`). Only a VALID encrypted-marker record is published (scripts/publish-data.mjs); the last step says so by name.
#
#   Automatic:  every push to main that changes sql-assistant-data/**  (the commit it makes does not re-trigger it: pushes by GITHUB_TOKEN never start workflows)
#   Manual:     Actions → "Publish SQL Assistant data" → Run workflow
#               · rebuild_central_vault = true  → also builds the CENTRAL TOKEN VAULT (a read-only token, encrypted) from the secrets below and publishes it
#
# Secrets (only for the central token vault):  SQLA_DEVICE_TOKEN (fine-grained, ONE repository, Contents: READ-ONLY)   SQLA_VAULT_PASSPHRASE (≥ 10 characters; not the public default)
# Variables (optional):  SQLA_ALLOW_DEFAULT_VAULT_PASSPHRASE = true  (accept the PUBLIC default passphrase instead of SQLA_VAULT_PASSPHRASE)
#                        SQLA_SITE_PUBLISH_WORKFLOW = the file name of the workflow that deploys the site (for example publish.yml). It must have a workflow_dispatch trigger. Needed only if the site is NOT
#                        republished by a push event: a commit made with GITHUB_TOKEN does not trigger push workflows, but workflow_dispatch IS allowed, and this workflow starts it.
on:
  push: { branches: [main], paths: ['sql-assistant-data/**'] }
  workflow_dispatch:
    inputs:
      rebuild_central_vault: { description: 'Also (re)build the central token vault from SQLA_DEVICE_TOKEN (replaces the vault file in sql-assistant-data/vault/)', type: boolean, default: false }
permissions: { contents: write, actions: write }
concurrency: { group: publish-data, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: Central token vault (only when requested)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_central_vault }}
        env:
          SQLA_DEVICE_TOKEN: ${{ secrets.SQLA_DEVICE_TOKEN }}
          SQLA_VAULT_PASSPHRASE: ${{ secrets.SQLA_VAULT_PASSPHRASE }}
          SQLA_ALLOW_DEFAULT_VAULT_PASSPHRASE: ${{ vars.SQLA_ALLOW_DEFAULT_VAULT_PASSPHRASE }}
          SQLA_REPOSITORY: ${{ github.repository }}
          SQLA_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/build-central-vault.mjs
      - name: Mirror sql-assistant-data/ (including security/admin-credential.json) into dist/sql-assistant-data/ (marker last)
        run: node scripts/publish-data.mjs --src . --dest dist --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
      - name: Commit the publication
        id: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sql-assistant-data dist/sql-assistant-data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Nothing to commit — the publication is already current."; exit 0; fi
          git commit -m "Publish SQL Assistant data (via workflow)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Start the site publication (optional)
        if: ${{ steps.commit.outputs.changed == 'true' && vars.SQLA_SITE_PUBLISH_WORKFLOW != '' }}
        env: { GH_TOKEN: '${{ github.token }}', WF: '${{ vars.SQLA_SITE_PUBLISH_WORKFLOW }}' }
        run: gh workflow run "$WF" --ref "${{ github.event.repository.default_branch }}"
      - name: Check that the central Admin Password record is published (devices with no token verify against it)
        run: |
          if [ -f sql-assistant-data/security/admin-credential.json ]; then
            node -e "const m=JSON.parse(require('fs').readFileSync('dist/sql-assistant-data/published.json','utf8')); if(!m.files['sql-assistant-data/security/admin-credential.json']){console.error('::error title=Admin Password record::sql-assistant-data/security/admin-credential.json is NOT published: it is not a valid encrypted-marker record. Devices keep their last good record. Replace it with a record saved from Settings > Security, or delete sql-assistant-data/security/ to return every device to its local password.'); process.exit(1);} console.log('The Admin Password record is published and listed in the publication marker.');"
          else
            echo "There is no central Admin Password record in the repository: devices use their local Admin Password (V17.6.4 behaviour)."
          fi
