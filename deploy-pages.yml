name: Build, test and deploy SQL Assistant to GitHub Pages
# V17.6.4 — every stage is its own step, so a failure names the stage. The build now runs BEFORE the security check (the check scans dist/index.html, which a fresh checkout may not contain),
# TypeScript is pinned in package.json (no surprise major version), and the install step is deterministic.
# One-time setting (Settings → Pages → Build and deployment → Source = "GitHub Actions"): the deploy job says so, by name, if it is missing.
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: Toolchain versions
        run: node --version && npm --version
      - name: Install (package-lock.json when present, otherwise package.json — TypeScript is pinned there)
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          node -e "const v=require('typescript/package.json').version; console.log('TypeScript '+v); if(!/^5\./.test(v)){console.error('::error::TypeScript '+v+' was installed; this project is verified with the 5.x version pinned in package.json (tsconfig uses moduleResolution node).'); process.exit(1);}"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (dist/index.html, release/)
        run: npm run build
      - name: Security check (scans the source and dist/index.html)
        run: npm run security
      - name: Tests
        run: npm test
      - name: Final production build
        run: npm run build
      # V17.6.2 — central repository access: publish the PUBLIC address of the repository access service next to index.html (a repository VARIABLE, not a secret). Without the variable nothing is published
      # and SQL Assistant behaves as in V17.6.1 (token on the device). The PAT itself is never part of this site: it is the secret SQLA_GITHUB_PAT, used only by the service (deploy-broker.yml).
      - name: Publish the repository-access configuration
        if: ${{ vars.SQLA_BROKER_URL != '' }}
        env: { BROKER_URL: '${{ vars.SQLA_BROKER_URL }}' }
        run: |
          mkdir -p release/sql-assistant-data
          node -e "require('fs').writeFileSync('release/sql-assistant-data/repo-broker.config.json', JSON.stringify({ repositoryBroker: { enabled: true, url: process.env.BROKER_URL } }, null, 2) + '\n')"
      - uses: actions/upload-pages-artifact@v3
        with: { path: release }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - name: Check that GitHub Pages is enabled for this repository
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
        run: |
          code=$(gh api "repos/$REPO/pages" --silent -i 2>/dev/null | head -1 | awk '{print $2}')
          if [ "$code" = "404" ]; then echo "::error::GitHub Pages is not enabled for $REPO. Open Settings → Pages → Build and deployment → Source and choose \"GitHub Actions\", then re-run this workflow."; exit 1; fi
          echo "Pages configuration check returned HTTP ${code:-unknown} (only 404 is treated as 'not enabled')."
      - id: d
        uses: actions/deploy-pages@v4
