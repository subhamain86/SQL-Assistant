name: Build, test and deploy SQL Assistant to GitHub Pages
# V17.6.9 — every stage is its own step, so a failure names the stage; no step is allowed to fail silently and the deploy job cannot start unless the whole build job — including the tests — succeeded.
#   Order: checkout → setup Node → install (verify the committed, checksum-pinned TypeScript 5.8.3) → typecheck → lint → repository hygiene (orphaned / stale files, reported separately) → workflow guard → production build → security scan → artifact verification → tests → final build → publish → deploy.
#   V17.7.5 — NODE AND THE DEFAULT GITHUB_TOKEN ONLY. Every step calls node directly (the same ordered stages as `node scripts/ci.mjs`); there is no package manager, no package download, no cloud login and no secret in this workflow.
#   Typecheck, lint, security and the tests all start from the production entry point src/main.ts (tsconfig.json: files = [src/main.ts]); they never see files that the application does not reach.
#   Each failing step writes a GitHub Actions error annotation (::error title=…) and, at the end, a job summary that names the failing stage and what to do. Secret values are never printed.
# One-time setting (Settings → Pages → Build and deployment → Source = "GitHub Actions"): the deploy job says so, by name, if it is missing.
# V17.7.4: a usage batch written by the serverless analytics provider is a commit to sql-assistant-data/analytics/**; it must not rebuild and redeploy the site
on: { push: { branches: [main], paths-ignore: ['sql-assistant-data/analytics/**'] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: Toolchain versions
        run: node --version
      # V17.7.5 — the Install step VERIFIES the compiler that ships with the project (tools/typescript, every file against CHECKSUMS.json). A missing or modified file stops the build and is named; there is no fallback to anything else.
      - name: Install (verify the committed, checksum-pinned TypeScript in tools/typescript — nothing is downloaded, no credentials, no fallback)
        id: install
        run: node scripts/check-toolchain.mjs --committed-only
      - name: Typecheck
        id: typecheck
        run: node scripts/tsc.mjs -p tsconfig.json --noEmit
      - name: Lint
        id: lint
        run: node scripts/lint.mjs
      - name: Repository hygiene (orphaned / stale files — reported by name, never deleted here)
        id: hygiene
        run: node scripts/check-stale.mjs
      - name: Workflow guard (Node and GITHUB_TOKEN only — scripts/workflow-policy.mjs)
        id: workflows
        run: node scripts/check-workflows.mjs
      - name: Build (dist/index.html, release/)
        id: build
        run: node scripts/build.mjs
      - name: Security check (scans the source and every generated output)
        id: security
        run: node scripts/security_check.mjs
      - name: Verify the generated artifact (root index.html = dist/index.html = release/, structure, no secret)
        id: artifact
        run: node scripts/verify-artifact.mjs
      - name: Tests
        id: tests
        run: node --test --test-concurrency=1 test/*.test.mjs
      - name: Final production build
        id: final
        run: node scripts/build.mjs
      # V17.6.2 — central repository access: publish the PUBLIC address of the repository access service next to index.html (a repository VARIABLE, not a secret). Without the variable nothing is published
      # and SQL Assistant behaves as in V17.6.1 (token on the device). The PAT itself is never part of this site: it is the secret SQLA_GITHUB_PAT, set as an environment variable on the host that runs the service (package-repo-broker.yml builds the service package).
      - name: Publish the repository-access configuration
        if: ${{ vars.SQLA_BROKER_URL != '' }}
        env: { BROKER_URL: '${{ vars.SQLA_BROKER_URL }}' }
        run: |
          mkdir -p release/sql-assistant-data
          node -e "require('fs').writeFileSync('release/sql-assistant-data/repo-broker.config.json', JSON.stringify({ repositoryBroker: { enabled: true, url: process.env.BROKER_URL } }, null, 2) + '\n')"
      # V17.7.3 — optional Usage Analytics: publish the PUBLIC settings of the analytics feature next to index.html (repository VARIABLES, not secrets). Without SQLA_ANALYTICS_URL nothing is published and
      # analytics stays off. The administrator password is NOT part of this site: it exists only as a hash inside the analytics service, on the host that runs it (package-analytics-service.yml builds the service package).
      - name: Publish the analytics configuration (public settings only)
        if: ${{ vars.SQLA_ANALYTICS_URL != '' && vars.SQLA_ANALYTICS_PROVIDER != 'repository' }}
        env:
          ANALYTICS_URL: '${{ vars.SQLA_ANALYTICS_URL }}'
          INACTIVITY: '${{ vars.SQLA_ANALYTICS_INACTIVITY_SECONDS }}'
          COLLECT_IDENTITY: '${{ vars.SQLA_ANALYTICS_COLLECT_USER_IDENTITY }}'
          ADMIN_AUTH: '${{ vars.SQLA_ANALYTICS_ADMIN_AUTHENTICATION_ENABLED }}'
          ADMIN_SESSION: '${{ vars.SQLA_ANALYTICS_ADMIN_SESSION_SECONDS }}'
          APP_VERSION: '${{ vars.SQLA_ANALYTICS_APPLICATION_VERSION }}'
        run: |
          mkdir -p release/sql-assistant-data
          node -e "const e=process.env,a={enabled:true,provider:'service',serviceUrl:e.ANALYTICS_URL};if(e.INACTIVITY)a.inactivityTimeout=Number(e.INACTIVITY);if(e.COLLECT_IDENTITY)a.collectUserIdentity=e.COLLECT_IDENTITY==='true';if(e.ADMIN_AUTH)a.adminAuthenticationEnabled=e.ADMIN_AUTH!=='false';if(e.ADMIN_SESSION)a.adminSessionTimeout=Number(e.ADMIN_SESSION);if(e.APP_VERSION)a.applicationVersion=e.APP_VERSION;require('fs').writeFileSync('release/sql-assistant-data/analytics.config.json',JSON.stringify({analytics:a},null,2)+'\\n')"
      # V17.7.4 — the SERVERLESS analytics provider: the same PUBLIC settings file, with provider "repository" (no server, no URL, no secret). Needs only the repository VARIABLE SQLA_ANALYTICS_PROVIDER = repository.
      # The administrator password and the private key are NOT here: they exist only as a password-wrapped key file in the repository (sql-assistant-data/analytics/admin-key.json), created by Analytics → Set up in the app.
      - name: Publish the analytics configuration (serverless provider, public settings only)
        if: ${{ vars.SQLA_ANALYTICS_PROVIDER == 'repository' }}
        env:
          REPO_PATH: '${{ vars.SQLA_ANALYTICS_REPOSITORY_PATH }}'
          RETENTION: '${{ vars.SQLA_ANALYTICS_RETENTION_DAYS }}'
          INACTIVITY: '${{ vars.SQLA_ANALYTICS_INACTIVITY_SECONDS }}'
          COLLECT_IDENTITY: '${{ vars.SQLA_ANALYTICS_COLLECT_USER_IDENTITY }}'
          ADMIN_AUTH: '${{ vars.SQLA_ANALYTICS_ADMIN_AUTHENTICATION_ENABLED }}'
          ADMIN_SESSION: '${{ vars.SQLA_ANALYTICS_ADMIN_SESSION_SECONDS }}'
          APP_VERSION: '${{ vars.SQLA_ANALYTICS_APPLICATION_VERSION }}'
          PUBLIC_KEY: '${{ vars.SQLA_ANALYTICS_PUBLIC_KEY_JSON }}'
        run: |
          mkdir -p release/sql-assistant-data
          node -e "const e=process.env,a={enabled:true,provider:'repository'};if(e.REPO_PATH)a.repositoryPath=e.REPO_PATH;if(e.RETENTION)a.retentionDays=Number(e.RETENTION);if(e.INACTIVITY)a.inactivityTimeout=Number(e.INACTIVITY);if(e.COLLECT_IDENTITY)a.collectUserIdentity=e.COLLECT_IDENTITY==='true';if(e.ADMIN_AUTH)a.adminAuthenticationEnabled=e.ADMIN_AUTH!=='false';if(e.ADMIN_SESSION)a.adminSessionTimeout=Number(e.ADMIN_SESSION);if(e.APP_VERSION)a.applicationVersion=e.APP_VERSION;if(e.PUBLIC_KEY)a.publicKey=JSON.parse(e.PUBLIC_KEY);require('fs').writeFileSync('release/sql-assistant-data/analytics.config.json',JSON.stringify({analytics:a},null,2)+'\\n')"
      - name: Verify the artifact that will be published
        id: artifact-final
        run: node scripts/verify-artifact.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: release }
      - name: Explain the failure (stage, component, retry, guidance)
        if: ${{ failure() }}
        env: { STEPS: '${{ toJSON(steps) }}' }
        run: |
          node -e "
          const s = JSON.parse(process.env.STEPS || '{}'); const names = { install: 'Install / toolchain', typecheck: 'Typecheck', lint: 'Lint', hygiene: 'Repository hygiene (orphaned / stale files)', build: 'Production build', security: 'Security check', artifact: 'Artifact verification', tests: 'Tests', workflows: 'Workflow guard', final: 'Final production build', 'artifact-final': 'Artifact verification (published output)' };
          const bad = Object.entries(s).filter(([, v]) => v.outcome === 'failure').map(([k]) => names[k] || k);
          const guide = { 'Repository hygiene (orphaned / stale files)': 'Files of an earlier version are still in the repository. Review the annotated names, then run: node scripts/prune-orphans.mjs --delete && node scripts/prune-stale.mjs --delete, and commit the deletion.', Tests: 'Fix the failing tests; they are not skipped and the deployment will not start while any fails.', 'Install / toolchain': 'tools/typescript must be intact: every file must match tools/typescript/CHECKSUMS.json (the failing file is named above). Restore the folder from the repository; nothing is downloaded as a fallback.', 'Workflow guard': 'A workflow broke the policy in scripts/workflow-policy.mjs (Node and GITHUB_TOKEN only): see the file, line and rule annotated above.' };
          const lines = ['## Build failed — nothing was deployed', '', ...bad.map((b) => '- **Stage:** ' + b + (guide[b] ? ' — ' + guide[b] : '')), '', 'Retry: re-run the workflow after the cause above is fixed. No secret value is printed by this workflow.'];
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n'); console.log('::error title=Build failed::Failing stage(s): ' + bad.join(', ') + ' — see the job summary.');
          "
  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - name: Check that GitHub Pages is enabled for this repository
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
        run: |
          code=$(gh api "repos/$REPO/pages" --silent -i 2>/dev/null | head -1 | awk '{print $2}')
          if [ "$code" = "404" ]; then echo "::error title=Deployment blocked::GitHub Pages is not enabled for $REPO. Open Settings → Pages → Build and deployment → Source and choose \"GitHub Actions\", then re-run this workflow."; exit 1; fi
          echo "Pages configuration check returned HTTP ${code:-unknown} (only 404 is treated as 'not enabled')."
      - id: d
        uses: actions/deploy-pages@v4
