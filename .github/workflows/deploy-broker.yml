
name: Deploy the repository access service (holds the central PAT)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-broker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-broker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: central-repository-access

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate required secrets and variables
        env:
          PAT: ${{ secrets.SQLA_GITHUB_PAT }}
          SESSION_SECRET: ${{ secrets.SQLA_SESSION_SECRET }}
          CLIENT: ${{ vars.SQLA_GITHUB_CLIENT_ID }}
          ORIGINS: ${{ vars.SQLA_ALLOWED_ORIGINS }}
        run: |
          [ -n "$PAT" ] || { echo "::error::SQLA_GITHUB_PAT is not set."; exit 1; }
          [ -n "$SESSION_SECRET" ] || { echo "::error::SQLA_SESSION_SECRET is not set."; exit 1; }
          [ "${#SESSION_SECRET}" -ge 32 ] || { echo "::error::SQLA_SESSION_SECRET must contain at least 32 characters."; exit 1; }
          [ -n "$CLIENT" ] || { echo "::error::SQLA_GITHUB_CLIENT_ID is not set."; exit 1; }
          [ -n "$ORIGINS" ] || { echo "::error::SQLA_ALLOWED_ORIGINS is not set."; exit 1; }

      - name: Verify the PAT before deployment
        env:
          SQLA_GITHUB_PAT: ${{ secrets.SQLA_GITHUB_PAT }}
          SQLA_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-pat.mjs

      - name: Validate broker configuration
        env:
          SQLA_GITHUB_CLIENT_ID: ${{ vars.SQLA_GITHUB_CLIENT_ID }}
          SQLA_ALLOWED_ORIGINS: ${{ vars.SQLA_ALLOWED_ORIGINS }}
        run: |
          node -e "import('./server/repo-broker.mjs').then(m => { m.createBroker(process.env); console.log('Configuration accepted'); })"

      - name: Package the service
        run: |
          mkdir -p pkg
          cp server/repo-broker.mjs pkg/server.mjs
          printf '{ "name": "sql-assistant-repo-broker", "private": true, "type": "module", "scripts": { "start": "node server.mjs" }, "engines": { "node": ">=20" } }\n' > pkg/package.json

      # Add your hosting provider's deployment steps here.
      # Configure these environment variables securely on the host:
      # SQLA_GITHUB_PAT
      # SQLA_SESSION_SECRET
      # SQLA_GITHUB_CLIENT_ID
      # SQLA_ALLOWED_ORIGINS
      # SQLA_ALLOWED_REPOSITORIES=${{ github.repository }}

      - name: Deployment instructions
        run: |
          echo "Package created in pkg/."
          echo "Configure the host environment variables and deploy pkg/ using your hosting provider."

      # Enable this check after deployment and configure the actual service URL.
      # - name: Health check
      #   env:
      #     BROKER_URL: ${{ vars.SQLA_BROKER_URL }}
      #   run: |
      #     curl -fsS "$BROKER_URL/healthz" -o health.json
      #     grep -q '"patConfigured":true' health.json || {
      #       echo "::error::The service reports that no PAT is configured."
      #       exit 1
      #     }
